[project]
name = "documind-ai"
version = "0.1.0"
description = "Production-grade AI document intelligence system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "llama-index-core>=0.14.26",
    "openai>=3.55.1",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
